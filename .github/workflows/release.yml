name: Release

on:
  push:
    tags:
      - 'v*'          # e.g. v0.16, v1.0.0
  workflow_dispatch:  # manual build (no release unless run on a tag)

permissions:
  contents: write     # required for softprops/action-gh-release to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0            # full history so maven-jgit-buildnumber-plugin can read the tag

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Stamp version
        run: mvn -B versions:set -DnewVersion=${{ steps.version.outputs.version }} -DprocessAllModules -DgenerateBackupPoms=false

      - name: Build
        run: mvn -B clean install -DskipTests

      - name: Release notes body
        run: |
          V="${{ steps.version.outputs.version }}"
          : > RELEASE_NOTES.md   # always exists (empty when CHANGELOG has no matching section)
          if [[ -f CHANGELOG.md ]]; then
            awk -v v="$V" '
              /^## / { if (grab) exit; if (index($0, v)) { grab=1; next } }
              grab { print }
            ' CHANGELOG.md > RELEASE_NOTES.md || true
          fi

      - name: Create release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Version ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          # Curated CHANGELOG section (if any) as the body, plus auto-generated "What's Changed".
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            modules/dist/target/client-modlauncher-${{ steps.version.outputs.version }}.zip
            modules/crux/target/crux-clientmod-${{ steps.version.outputs.version }}.zip
            modules/crux/target/crux-clientmod.jar
