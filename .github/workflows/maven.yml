# Full-reactor sanity build on pushes / PRs. Releases are handled by release.yml (on v* tags).

name: Java CI with Maven

on:
  push:
    branches: [ crux, master, main ]
  pull_request:
    branches: [ crux, master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build with Maven
        run: mvn -B clean install -DskipTests
